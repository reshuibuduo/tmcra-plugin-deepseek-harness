name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Harness is pinned exactly; release candidates may be newer than pnpm's
      # default package-age window. The lockfile and package integrities remain verified.
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dsh-compat
      - run: npm run pack:check
      - run: pnpm audit --prod
