name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # Harness is pinned exactly; release candidates may be newer than pnpm's
      # default package-age window. The lockfile and package integrities remain verified.
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dsh-compat
      - run: npm run pack:check
      - name: Audit production dependencies
        run: >-
          pnpm --config.fetch-retries=0 --config.fetch-timeout=30000
          audit --prod --ignore-registry-errors
          --registry=https://registry.npmjs.org
